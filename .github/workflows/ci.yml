name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: interntrack_test
          POSTGRES_USER: interntrack
          # This disposable database is published only on the job runner's loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U interntrack -d interntrack_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run SQLite and PostgreSQL tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://interntrack@127.0.0.1:5432/interntrack_test
          GEMINI_API_KEY: ""
        run: python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Compose validation and image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Validate Compose and build images
        env:
          AUTH_ALLOWED_ORIGINS: https://interntrack.example
          AUTH_COOKIE_SECURE: "true"
          GEMINI_API_KEY: ""
        run: |
          # Compose requires this variable for interpolation even when building only.
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export POSTGRES_PASSWORD
          docker compose config --quiet
          docker compose build frontend backend
