services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:${INTERNTRACK_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://interntrack@postgres:5432/interntrack
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private Compose env file}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      AUTH_ALLOWED_ORIGINS: "${AUTH_ALLOWED_ORIGINS:?Set AUTH_ALLOWED_ORIGINS to the exact browser origin}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      # The API has no published port. Nginx replaces browser forwarding headers.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web, data]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: interntrack
      POSTGRES_USER: interntrack
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private Compose env file}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "interntrack", "-d", "interntrack"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

networks:
  web:
  data:
    internal: true

volumes:
  postgres_data:
